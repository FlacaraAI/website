<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flacara — Four Hero Studies</title>

<!-- Prototype only. Production must self-host these (DESIGN_SYSTEM.md §3.7). -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:wght@500;600&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --fl-ink:#151616; --fl-muted:#5F6060;
  --fl-accent:#1E3352; --fl-on-accent:#F5FBFF;

  /* Ground pulled off pure white so the outline has headroom on both sides —
     a white stroke on a #FFFFFF ground has no highlight to give. */
  --fl-ground:linear-gradient(135deg,#FCFCFC 0%,#ECECEC 100%);
  --sp:linear-gradient(135deg,#C9DAF8 0%,#CECBDF 35%,#DB9D91 100%);

  --fl-display:'Zalando Sans SemiExpanded',system-ui,sans-serif;
  --fl-text:'Geist',system-ui,sans-serif;
  --fl-mono:'Geist Mono',ui-monospace,monospace;
  --fl-ease:cubic-bezier(.2,0,0,1); --fl-dur:150ms;

  /* Outside DESIGN_SYSTEM §8 ("no drop shadows"). */
  --lift-ico:drop-shadow(0 9px 14px rgba(148,153,158,.42));
  --lift-txt:drop-shadow(0 9px 14px rgba(148,153,158,.38));

  /* Emboss, not float: white highlight up-left, light cool shadow down-right. */
  --lift-outline:drop-shadow(-1.5px -1.5px 0 rgba(255,255,255,.95))
                 drop-shadow(0 3px 5px rgba(178,184,192,.52))
                 drop-shadow(0 12px 26px rgba(178,184,192,.34));
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#F4F4F4;color:var(--fl-ink);
  font-family:var(--fl-text);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--fl-accent);outline-offset:3px}

/* ---------- lockup: icon + wordmark, sized as one unit ---------- */
.lock{display:flex;align-items:center;gap:.2em;font-size:clamp(2.75rem,7.6vw,5.75rem)}
.lock .ico{width:.88em;height:.88em;flex:none;overflow:visible;filter:var(--lift-ico)}
.lock .logo{font-family:var(--fl-display);font-weight:600;
  font-size:1em;line-height:1;letter-spacing:-.02em;margin:0;
  background:var(--sp);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;filter:var(--lift-txt)}

/* ---------- tagline ---------- */
.tag{font-weight:400;font-size:clamp(1rem,1.5vw,1.1875rem);line-height:1.4;
  color:var(--fl-muted);margin:0}
.tag.wide{text-transform:uppercase;letter-spacing:.24em;font-weight:500;
  font-size:clamp(.75rem,1.05vw,.8125rem)}

/* ---------- accent pill ---------- */
.sp{height:10px;width:60px;border-radius:999px;flex:none;background:var(--sp)}

/* ---------- product outline ---------- */
.outline{position:absolute;z-index:0;color:#F4F4F4;pointer-events:none;
  overflow:visible;filter:var(--lift-outline);transform:translate(-50%,-50%)}

/* ---------- section chrome ---------- */
.hero{position:relative;min-height:100vh;display:flex;padding:96px 48px;
  overflow:hidden;background:var(--fl-ground)}
.wrap{position:relative;z-index:1;width:100%;max-width:1200px;margin:0 auto}
.mark{position:absolute;top:28px;right:34px;z-index:2;font-family:var(--fl-mono);
  font-size:.625rem;letter-spacing:.16em;color:var(--fl-muted);opacity:.55}

/* ---------- reveal ---------- */
.r{opacity:0;transform:translateY(12px);
  transition:opacity .7s var(--fl-ease),transform .7s var(--fl-ease);transition-delay:var(--d,0ms)}
.in .r{opacity:1;transform:none}
/* outline fades only — it must keep its centring transform */
.ro{opacity:0;transition:opacity 1.1s var(--fl-ease);transition-delay:var(--d,0ms)}
.in .ro{opacity:1}
@media (prefers-reduced-motion:reduce){
  .r,.ro{transition:none;opacity:1;transform:none}
  .outline{transform:translate(-50%,-50%)}
  html{scroll-behavior:auto}
}

/* ---------- index nav ---------- */
.idx{position:fixed;left:26px;bottom:26px;z-index:40;display:flex;flex-direction:column;gap:5px;
  font-family:var(--fl-mono);font-size:.625rem;letter-spacing:.1em}
.idx a{color:var(--fl-muted);text-decoration:none;padding:3px 8px;border-radius:3px;
  background:rgba(255,255,255,.72);backdrop-filter:blur(8px);transition:color var(--fl-dur) var(--fl-ease)}
.idx a:hover{color:var(--fl-ink)}
.idx a.on{color:var(--fl-on-accent);background:var(--fl-accent)}

/* =======================================================================
   Four layouts. Colour is identical across all of them by design — the only
   variable left is composition. --flame samples the ground so the three
   flames read as punched through the disc rather than painted on it.
   D2/D4 centre the outline on the right half; F2/F3 on the screen.
   ======================================================================= */

/* ---- D2 · CORNER — tagline top-right, lockup bottom-left ---- */
#d2{align-items:center;--flame:#F5F5F5}
#d2 .wrap{display:grid;grid-template-rows:auto 1fr auto;min-height:58vh}
#d2 .top{grid-row:1;justify-self:end;text-align:right}
#d2 .btm{grid-row:3}
#d2 .sp{margin-bottom:24px}

/* ---- D4 · COLUMN — left stack, outline occupying the right half ---- */
#d4{align-items:center;--flame:#F6F6F6}
#d4 .col{max-width:min(52%,620px)}
#d4 .sp{margin:32px 0 22px}

/* right-half centre, oversized enough to bleed off three edges */
#d2 .outline,#d4 .outline{left:75%;top:50%;width:min(74vw,120vh);height:min(74vw,120vh)}

/* ---- F2 · PLATE — centred, outline as a watermark behind the lockup ---- */
#f2{align-items:center;text-align:center;--flame:#F5F5F5}
#f2 .wrap{display:grid;justify-items:center}
#f2 .tag{margin-top:26px}
#f2 .sp{margin-top:36px;width:72px}

/* ---- F3 · LOW — lockup in the lower third ---- */
#f3{align-items:flex-end;text-align:center;padding-bottom:16vh;--flame:#F3F3F3}
#f3 .wrap{display:grid;justify-items:center}
#f3 .sp{margin-bottom:40px}
#f3 .tag{margin-top:24px}

/* screen centre, oversized enough to bleed top and bottom */
#f2 .outline,#f3 .outline{left:50%;top:50%;width:min(124vw,126vh);height:min(124vw,126vh)}

/* ---------- short viewports (13" laptops) ---------- */
@media (min-width:921px) and (max-height:820px){
  .hero{padding:64px 48px}
  .lock{font-size:clamp(2.5rem,6.4vw,4.75rem)}
  #d2 .wrap{min-height:46vh}
  #f2 .sp{margin-top:28px}
  #f3{padding-bottom:12vh}
  #f3 .sp{margin-bottom:30px}
}

/* ---------- responsive ---------- */
@media (max-width:920px){
  .hero{padding:88px 24px}
  .lock{gap:.16em}
  .sp{height:9px;width:52px}
  #d2 .wrap{gap:20vh}
  #d2 .top{justify-self:start;text-align:left}
  #d4 .col{max-width:100%}
  #d2 .outline,#d4 .outline{left:72%;width:min(128vw,104vh);height:min(128vw,104vh)}
  #f2 .outline,#f3 .outline{width:min(136vw,108vh);height:min(136vw,108vh)}
  #f3{padding-bottom:14vh}
  .idx{display:none}
}
</style>
</head>

<script>
// Reveal on enter; keep the index nav in sync. Same pattern as heroes.html.
var secs = document.querySelectorAll('.hero');
var links = document.querySelectorAll('.idx a');

var reveal = new IntersectionObserver(function(entries){
  entries.forEach(function(e){ if (e.isIntersecting) e.target.classList.add('in'); });
}, { threshold: 0.15 });

var active = new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    if (!e.isIntersecting) return;
    links.forEach(function(a){ a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id); });
  });
}, { threshold: 0.5 });

secs.forEach(function(s){ reveal.observe(s); active.observe(s); });
</script>
