<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#F2F4F5"/>
  <text x="40" y="50" font-size="24" font-weight="700" fill="#151616">Flacara — the ramp gradient (fl-ramp)</text>
  <text x="40" y="74" font-size="13" fill="#5F6060">Blue and red/terracotta endpoints, lavender accent at the midpoint blend</text>

  <!-- full gradient bar -->
  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9DAF8"/>
      <stop offset="35%" stop-color="#CECBDF"/>
      <stop offset="100%" stop-color="#DB9D91"/>
    </linearGradient>
  </defs>
  <rect x="40" y="100" width="920" height="90" fill="url(#ramp)" stroke="#BBBDBE"/>
  <text x="40" y="210" font-size="12" fill="#5F6060">linear-gradient(135deg, #C9DAF8 0%, #CECBDF 35%, #DB9D91 100%)</text>

  <!-- isolated endpoint swatches -->
  <g transform="translate(40,250)">
    <rect width="280" height="200" fill="#C9DAF8" stroke="#BBBDBE"/>
    <text x="12" y="228" font-size="16" font-weight="700" fill="#151616">Blue end</text>
    <text x="12" y="250" font-size="13" fill="#5F6060">#C9DAF8</text>
  </g>

  <g transform="translate(360,250)">
    <rect width="280" height="200" fill="#CECBDF" stroke="#BBBDBE"/>
    <text x="12" y="228" font-size="16" font-weight="700" fill="#151616">Midpoint (fl-accent)</text>
    <text x="12" y="250" font-size="13" fill="#5F6060">#CECBDF · 35%</text>
  </g>

  <g transform="translate(680,250)">
    <rect width="280" height="200" fill="#DB9D91" stroke="#BBBDBE"/>
    <text x="12" y="228" font-size="16" font-weight="700" fill="#151616">Red/terracotta end</text>
    <text x="12" y="250" font-size="13" fill="#5F6060">#DB9D91</text>
  </g>
</svg>
