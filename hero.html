<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flacara</title>

<!-- Prototype only. Production must self-host these (DESIGN_SYSTEM.md §3.7). -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:wght@600&family=Geist:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --fl-ink:#151616; --fl-muted:#5F6060; --fl-accent:#1E3352;

  /* Ground: 135deg, light top-left. Deliberately off pure white so the
     product outline has headroom for a highlight (DESIGN_SYSTEM §2.5). */
  --fl-ground:linear-gradient(135deg,#FCFCFC 0%,#ECECEC 100%);

  /* Brand ramp. Split across the lockup: disc 0→20%, wordmark 20→100%. */
  --fl-ramp:     linear-gradient(135deg,#C9DAF8 0%,#CECBDF 35%,#DB9D91 100%);
  --fl-ramp-tail:linear-gradient(135deg,#CCD1EA 0%,#CECBDF 18.75%,#DB9D91 100%);

  --fl-display:'Zalando Sans SemiExpanded',system-ui,sans-serif;
  --fl-text:'Geist',system-ui,sans-serif;
  --fl-ease:cubic-bezier(.2,0,0,1);

  --lift-ico:drop-shadow(0 9px 14px rgba(148,153,158,.42));
  --lift-txt:drop-shadow(0 9px 14px rgba(148,153,158,.38));
  --lift-outline:drop-shadow(-1.5px -1.5px 0 rgba(255,255,255,.95))
                 drop-shadow(0 3px 5px rgba(178,184,192,.52))
                 drop-shadow(0 12px 26px rgba(178,184,192,.34));

  /* single source of truth for lockup scale — the tagline indent derives
     from it so it always aligns to the wordmark, not the icon */
  --lock-size:clamp(2.75rem,7.6vw,5.75rem);
  --icon-span:1.08em; /* .88em disc + .20em gap */

  /* outline timing - --swap is derived, never set it by hand */
  --d0:140ms; --trace:2.2s; --hold:.35s;
  --swap:calc(var(--d0) + var(--trace) + var(--hold));
}

*{box-sizing:border-box}
body{margin:0;background:#F4F4F4;color:var(--fl-ink);
  font-family:var(--fl-text);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--fl-accent);outline-offset:3px}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100vh;display:flex;align-items:flex-end;
  padding:96px 48px 18vh;overflow:hidden;background:var(--fl-ground)}
.wrap{position:relative;z-index:1;width:100%;max-width:1200px;margin:0 auto}

/* ---------- lockup ---------- */
.stack{display:grid;justify-items:start}
.lock{display:flex;align-items:center;gap:.2em;font-size:var(--lock-size)}
.lock .ico{width:.88em;height:.88em;flex:none;overflow:visible;filter:var(--lift-ico)}
.lock .logo{font-family:var(--fl-display);font-weight:600;font-size:1em;line-height:1;
  letter-spacing:-.02em;margin:0;filter:var(--lift-txt);
  background:var(--fl-ramp-tail);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}

/* the disc takes the head of the ramp when the wordmark follows it */
.lock .ico{--disc:url(#ramp-head)}
/* a mark standing on its own carries the whole ramp */
.ico.solo{--disc:url(#ramp-full)}

/* ---------- tagline — sits under the wordmark, not under the icon ---------- */
.tag{font-family:var(--fl-text);font-weight:500;text-transform:uppercase;
  letter-spacing:.24em;font-size:clamp(.75rem,1.05vw,.8125rem);line-height:1.4;
  color:var(--fl-muted);margin:22px 0 0;
  margin-left:calc(var(--lock-size) * 1.08)}

/* ---------- accent pill ---------- */
.pill{height:10px;width:60px;border-radius:999px;background:var(--fl-ramp);
  margin-bottom:26px}

/* ---------- product stage ----------
   outline SVG and device photo share one box and one viewBox, so their
   centres coincide by construction - no nudging. */
.stage{position:absolute;z-index:0;pointer-events:none;overflow:visible;
  transform:translate(-50%,-50%);
  left:75%;top:50%;width:min(74vw,120vh);height:min(74vw,120vh)}
.outline{color:#F4F4F4;filter:var(--lift-outline)}
.device{opacity:0;filter:drop-shadow(0 14px 30px rgba(178,184,192,.42))}

/* ---------- outline draw-on ----------
   A: trace (default) - every ring draws at once, each from its own start
      point (--s), so the seams never line up.
   B: .a-comet  - a short arc laps each ring twice, the ring closing in
      behind it.
   C: .a-ripple - no tracing: rings pop from their own centre, outer to
      inner (--i), the drawing assembling itself.
   Swap by putting a-comet / a-ripple on .hero. */
.outline path{stroke-dasharray:0 1;stroke-dashoffset:var(--s,0);
  animation:fl-trace var(--trace) var(--fl-ease) var(--d0) forwards}
@keyframes fl-trace{to{stroke-dasharray:1 0}}

.a-comet .outline path{animation-name:fl-comet}
@keyframes fl-comet{
  0%  {stroke-dasharray:.05 .95;stroke-dashoffset:var(--s,0)}
  55% {stroke-dasharray:.05 .95;stroke-dashoffset:calc(var(--s,0) - 2)}
  100%{stroke-dasharray:1 0;   stroke-dashoffset:calc(var(--s,0) - 2)}
}

.a-ripple .outline path{stroke-dasharray:none;stroke-dashoffset:0;
  transform-box:fill-box;transform-origin:center;
  animation:fl-pop .8s var(--fl-ease) calc(var(--d0) + var(--i) * 90ms) both}
@keyframes fl-pop{from{opacity:0;transform:scale(.55)} to{opacity:1;transform:none}}

/* ---------- outline stays; device photo unused after the trace finishes ---------- */

/* ---------- reveal ----------
   CSS animation, not a JS-toggled class: this is a single above-the-fold
   hero, so there is nothing to observe and no reason for the content to
   depend on a script running. */
@keyframes fl-rise{from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none}}
@keyframes fl-fade{from{opacity:0} to{opacity:1}}
.r {opacity:0;animation:fl-rise .7s  var(--fl-ease) var(--d,0ms) forwards}
.ro{opacity:0;animation:fl-fade 1.1s var(--fl-ease) var(--d,0ms) forwards}
@media (prefers-reduced-motion:reduce){
  .r,.ro{animation:none;opacity:1}
  .outline{display:none}
  .device{animation:none;opacity:1}
}

@media (max-width:920px){
  .hero{padding:88px 24px 14vh}
  .lock{gap:.16em}
  .pill{height:9px;width:52px}
  .stage{left:72%;width:min(128vw,104vh);height:min(128vw,104vh)}
}
</style>
</head>
