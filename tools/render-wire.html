<!doctype html>
<!-- Offline: the wireframe draw-in that opens the doctors hero. The models'
     edges, in white, sweep in over ~2.6 s at exactly device3d.js's hero pose
     and framing, so the still can crossfade in on top. Driven by
     tools/render-wire.mjs → images/wire-h1.webm (VP9 alpha) + .mov (HEVC). -->
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { createScene, ASPECT, BASE } from '../device3d.js';
const H = 800, W = Math.round(H * ASPECT);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const { scene, camera, pivot, phone } = await createScene(renderer, '../');
// edges of every mesh, in the pivot's own space (pivot unrotated while measuring)
pivot.rotation.set(0, 0, 0); pivot.updateMatrixWorld(true);
const segs = [];
phone.traverse((o) => {
  if (!o.isMesh) return;
  const e = new THREE.EdgesGeometry(o.geometry, 24), pos = e.attributes.position;
  for (let i = 0; i < pos.count; i += 2) {
    segs.push([new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld),
               new THREE.Vector3().fromBufferAttribute(pos, i + 1).applyMatrix4(o.matrixWorld)]);
  }
  o.visible = false;
});
// sweep order: out from the housing, then down the phone
const origin = new THREE.Vector3(-0.015, 0.056, 0.01);
segs.sort((p, q) => p[0].distanceTo(origin) - q[0].distanceTo(origin));
const arr = new Float32Array(segs.length * 6);
segs.forEach(([a, b], i) => { arr.set([a.x, a.y, a.z, b.x, b.y, b.z], i * 6); });
const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
const lines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92 }));
pivot.add(lines);
pivot.rotation.set(BASE.x, BASE.y, BASE.z);
scene.environment = null; scene.traverse((o) => { if (o.isLight) o.visible = false; });
window.segCount = segs.length;
window.renderAt = (t) => {
  const drawn = Math.min(1, Math.max(0, t / 2.6));
  geo.setDrawRange(0, Math.floor(segs.length * (1 - Math.pow(1 - drawn, 2.2))) * 2);
  // the drawing settles into place: a touch of over-rotation that eases out
  const k = 1 - drawn;
  pivot.rotation.set(BASE.x + 0.05 * k, BASE.y - 0.18 * k, BASE.z + 0.02 * k);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
