<!doctype html>
<!-- Offline: the line-art draw-ins that open the two heroes. Only the large
     parts' decisive edges, white, sweeping in over ~2.6 s at exactly the
     hero's pose and framing, so the still can crossfade in on top.
       ?for=device   the doctors hero (device3d.js pose)   → images/wire-h1.*
       ?for=software the patients hero (phone3d.js pose)  → images/wire-phone.*
     Driven by tools/render-wire.mjs. -->
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { createScene, ASPECT, BASE } from '../device3d.js';
const FOR = new URLSearchParams(location.search).get('for') || 'device';
const H = 800, W = Math.round(H * ASPECT);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const { scene, camera, pivot, phone, size } = await createScene(renderer, '../');
// the software hero (phone3d.js) looks at the front, from a little further back
const SOFT = { x: -0.22, y: -0.38, z: -0.26 };
const base = FOR === 'software' ? SOFT : BASE;
if (FOR === 'software') {
  pivot.remove(phone);
  const facing = new THREE.Group(); facing.add(phone); facing.rotation.y = Math.PI; pivot.add(facing);
  camera.position.set(0, 0, size.y * 2.75); camera.lookAt(0, 0, 0);
}
pivot.rotation.set(0, 0, 0); pivot.updateMatrixWorld(true);
// only the large parts, only their decisive edges, and nothing tiny: the
// drawing should read as the object, not as the CAD
const segs = [];
phone.traverse((o) => {
  if (!o.isMesh) return;
  const b = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3());
  o.visible = false;
  if (Math.max(b.x, b.y, b.z) < 0.03) return;
  const e = new THREE.EdgesGeometry(o.geometry, 62), pos = e.attributes.position;
  for (let i = 0; i < pos.count; i += 2) {
    const a = new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
    const c = new THREE.Vector3().fromBufferAttribute(pos, i + 1).applyMatrix4(o.matrixWorld);
    if (a.distanceTo(c) < 0.0012) continue;
    segs.push([a, c]);
  }
});
// chain the segments into strokes (shared endpoints), so a line is drawn
// end to end like a pen, not switched on piece by piece
const key = (v) => v.x.toFixed(4) + ',' + v.y.toFixed(4) + ',' + v.z.toFixed(4);
const adj = new Map();
segs.forEach((sg, i) => { for (const v of sg) { const k = key(v); if (!adj.has(k)) adj.set(k, []); adj.get(k).push(i); } });
const used = new Uint8Array(segs.length), strokes = [];
for (let i = 0; i < segs.length; i++) {
  if (used[i]) continue;
  used[i] = 1;
  let pts = [segs[i][0], segs[i][1]];
  // extend forward from the end, then backward from the start
  for (const dir of [1, -1]) {
    for (;;) {
      const end = dir === 1 ? pts[pts.length - 1] : pts[0];
      const next = (adj.get(key(end)) || []).find((j) => !used[j]);
      if (next === undefined) break;
      used[next] = 1;
      const [p, q] = segs[next];
      const other = key(p) === key(end) ? q : p;
      if (dir === 1) pts.push(other); else pts.unshift(other);
      if (pts.length > 400) break;
    }
  }
  let len = 0; for (let k = 1; k < pts.length; k++) len += pts[k - 1].distanceTo(pts[k]);
  strokes.push({ pts, len });
}
const origin = new THREE.Vector3(-0.015, 0.056, 0.01);
strokes.sort((p, q) => p.pts[0].distanceTo(origin) - q.pts[0].distanceTo(origin));
// timing: strokes start in a wave out from the housing over DRAW s, each
// drawing at a steady pen speed (long strokes take longer); all done by DRAW + 0.35
const DRAW = 1.15, SPEED = 0.45; // metres per second of line, at model scale
strokes.forEach((st, i) => { st.t0 = Math.pow(i / strokes.length, 0.85) * DRAW; st.dur = Math.max(0.08, Math.min(0.35, st.len / SPEED)); });
const segCount = segs.length;
const arr = new Float32Array(segCount * 6);
const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
const lines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }));
pivot.add(lines);
scene.environment = null; scene.traverse((o) => { if (o.isLight) o.visible = false; });
window.segCount = segCount;
window.renderAt = (t) => {
  let n = 0;
  const put = (a, b) => { arr.set([a.x, a.y, a.z, b.x, b.y, b.z], n * 6); n++; };
  for (const st of strokes) {
    const f = Math.min(1, Math.max(0, (t - st.t0) / st.dur));
    if (f <= 0) continue;
    let budget = st.len * f;
    for (let k = 1; k < st.pts.length && budget > 0; k++) {
      const a = st.pts[k - 1], b = st.pts[k], d = a.distanceTo(b);
      if (d <= budget) { put(a, b); budget -= d; }
      else { put(a, a.clone().lerp(b, budget / d)); budget = 0; }
    }
  }
  geo.attributes.position.needsUpdate = true; geo.setDrawRange(0, n * 2);
  const drawn = Math.min(1, t / (DRAW + 0.35)), k = 1 - drawn;
  pivot.rotation.set(base.x + 0.05 * k, base.y - 0.18 * k, base.z + 0.02 * k);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
