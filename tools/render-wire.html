<!doctype html>
<!-- Offline: the line-art draw-ins that open the two heroes. Only the large
     parts' decisive edges, white, sweeping in over ~2.6 s at exactly the
     hero's pose and framing, so the still can crossfade in on top.
       ?for=device   the doctors hero (device3d.js pose)   → images/wire-h1.*
       ?for=software the patients hero (phone3d.js pose)  → images/wire-phone.*
     Driven by tools/render-wire.mjs. -->
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { createScene, ASPECT, BASE } from '../device3d.js';
const FOR = new URLSearchParams(location.search).get('for') || 'device';
const H = 800, W = Math.round(H * ASPECT);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const { scene, camera, pivot, phone, size } = await createScene(renderer, '../');
// the software hero (phone3d.js) looks at the front, from a little further back
const SOFT = { x: -0.22, y: -0.38, z: -0.26 };
const base = FOR === 'software' ? SOFT : BASE;
if (FOR === 'software') {
  pivot.remove(phone);
  const facing = new THREE.Group(); facing.add(phone); facing.rotation.y = Math.PI; pivot.add(facing);
  camera.position.set(0, 0, size.y * 2.75); camera.lookAt(0, 0, 0);
}
pivot.rotation.set(0, 0, 0); pivot.updateMatrixWorld(true);
// only the large parts, only their decisive edges, and nothing tiny: the
// drawing should read as the object, not as the CAD
const segs = [];
phone.traverse((o) => {
  if (!o.isMesh) return;
  const b = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3());
  o.visible = false;
  if (Math.max(b.x, b.y, b.z) < 0.02) return;
  const e = new THREE.EdgesGeometry(o.geometry, 50), pos = e.attributes.position;
  for (let i = 0; i < pos.count; i += 2) {
    const a = new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
    const c = new THREE.Vector3().fromBufferAttribute(pos, i + 1).applyMatrix4(o.matrixWorld);
    if (a.distanceTo(c) < 0.0006) continue;
    segs.push([a, c]);
  }
});
const origin = new THREE.Vector3(-0.015, 0.056, 0.01);
segs.sort((p, q) => p[0].distanceTo(origin) - q[0].distanceTo(origin));
const arr = new Float32Array(segs.length * 6);
segs.forEach(([a, b], i) => { arr.set([a.x, a.y, a.z, b.x, b.y, b.z], i * 6); });
const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
const lines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }));
pivot.add(lines);
scene.environment = null; scene.traverse((o) => { if (o.isLight) o.visible = false; });
window.segCount = segs.length;
window.renderAt = (t) => {
  const drawn = Math.min(1, Math.max(0, t / 2.6));
  geo.setDrawRange(0, Math.floor(segs.length * (1 - Math.pow(1 - drawn, 2.2))) * 2);
  const k = 1 - drawn;
  pivot.rotation.set(base.x + 0.05 * k, base.y - 0.18 * k, base.z + 0.02 * k);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
