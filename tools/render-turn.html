<!doctype html>
<!-- Offline: the turn that opens the doctors run-through — the h1 on the
     phone's back swings round to the phone's front, screen showing the app's
     first screen. Frames go into images/turn-sheet.webp (tools/render-turn.mjs)
     and are scrubbed by scroll on the page. Straight-on at both ends, so the
     last frame lands exactly on the page's CSS phone. -->
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { createScene } from '../device3d.js';
const W = 1100, H = 1500;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const { scene, camera, pivot, setRing, screen } = await createScene(renderer, '../');
camera.aspect = W / H; camera.updateProjectionMatrix();
const tex = await new THREE.TextureLoader().loadAsync('../images/app-home.webp');
tex.colorSpace = THREE.SRGBColorSpace; tex.flipY = true; tex.anisotropy = 8;
if (screen) screen.material = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
setRing(1);
const ease = (t) => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
window.renderFrame = (i, n) => {
  const p = ease(i / (n - 1));
  // back (0) → front (π); a slight tip toward the viewer in the middle of the turn
  pivot.rotation.set(0.10 * Math.sin(p * Math.PI), Math.PI * p, 0);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
