<!doctype html>
<!-- Offline: renders the "lift it on" frame sequence for the doctors page —
     the h1 descending onto the phone's camera and the ring lighting up —
     from the device3d.js scene. Driven by tools/render-attach.mjs, which
     packs the frames into images/attach-sheet.webp. -->
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { createScene } from '../device3d.js';
const W = 1280, H = 1600;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);
const { scene, camera, pivot, holder, setRing } = await createScene(renderer, '../');
// the hero's own angle, a little more turned so the housing's depth shows as it comes down
pivot.rotation.set(-0.26, 0.62, 0.22);
// the lifted device needs headroom: the pair sits low in the frame
pivot.position.y = -0.03;
camera.position.z *= 1.34; camera.updateProjectionMatrix();
const seated = holder.position.clone();
const ease = (t) => 1 - Math.pow(1 - t, 3);
window.renderFrame = (i, n) => {
  const p = i / (n - 1);
  const d = ease(Math.min(1, p / 0.7));            // descends over the first 70%
  // comes in from up and to the right, tipped, settling flat as it lands
  holder.position.copy(seated).add(new THREE.Vector3(0.03, 0.03, 0.12).multiplyScalar(1 - d));
  holder.rotation.set(-0.7 * (1 - d), 0.55 * (1 - d), 0.25 * (1 - d));
  setRing(Math.max(0, (p - 0.7) / 0.3));         // ring lights over the last 30%
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
